[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai3d-practice-lab"
version = "0.1.0"
description = "Readable, reproducible 2D Flow Matching experiments before 3D latent models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3", "numpy>=1.26,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5"]

[project.scripts]
flowlab = "flowlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
